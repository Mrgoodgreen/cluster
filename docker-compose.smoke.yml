# Local smoke: manager + mock worker (no GPU). Run from folder cluster/:
#   docker compose -f docker-compose.smoke.yml up -d --build
services:
  manager:
    build:
      context: .
      dockerfile: manager/Dockerfile
    image: tls-classify-manager:0.1.0
    ports:
      - "5357:5357"
    environment:
      DATABASE_URL: sqlite:////data/cluster.db
      STORAGE_ROOTS: smoke=/mnt/storage
      MANAGER_HOST: 0.0.0.0
      MANAGER_PORT: "5357"
    volumes:
      - manager_data:/data
      - ${SMOKE_STORAGE:-./smoke/storage}:/mnt/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5357/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile.mock
    image: tls-classify-worker-mock:0.1.0
    environment:
      MANAGER_URL: http://manager:5357
      WORKER_ID: smoke-worker-1
      WORKER_MODE: mock
      MOCK_STEP_SEC: "1"
    volumes:
      - ${SMOKE_STORAGE:-./smoke/storage}:/mnt/storage
    depends_on:
      manager:
        condition: service_healthy
    restart: unless-stopped

volumes:
  manager_data:
